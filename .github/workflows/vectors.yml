name: vectors

on:
  push:
  pull_request:

jobs:
  vectors:
    name: Vectors (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run conformance vectors
        run: node --experimental-strip-types vectors/run.ts
